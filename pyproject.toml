[project]
name = "btmcp"
version = "0.1.0"
description = "A point-in-time backtesting MCP server, built as a substrate for measuring tool-surface design."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp==2.1.1",
    "pydantic>=2.9",
    "polars>=1.17",
    "duckdb>=1.1",
    "pyarrow>=18.0",
    "numpy>=2.1",
    "pyyaml>=6.0",
    "tiktoken>=0.14.0",
    "anthropic>=1.4.0",
]

[project.optional-dependencies]
forecast = ["timesfm>=1.2"]
viz = ["matplotlib>=3.9"]
openai = ["openai>=1.100"]

[project.scripts]
btmcp-serve = "btmcp.server.cli:main"
btmcp-gen = "scripts.gen_synthetic:main"
btmcp-demo = "scripts.demo:main"
btmcp-eval = "scripts.run_eval:main"
btmcp-report = "scripts.report:main"
btmcp-audit = "scripts.token_audit:main"
btmcp-estimate = "scripts.estimate_cost:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["btmcp", "scripts"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# A data table of natural-language scenario prompts; reflowing prose hurts readability.
"scripts/gen_scenarios.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["btmcp/core", "btmcp/data"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "polars.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:btmcp.*"]
