id: err-01
category: error_recovery
split: dev
tier: simulate
prompt: Backtest a 20/50 SMA cross on SYN-99 from 2019 to 2021 with 5bp fees and 2bp slippage. If that
  symbol does not exist, find the dataset's momentum symbol and use that instead.
assertions:
- type: error_code_seen
  code: UNKNOWN_SYMBOL
- type: recovered_after_error
  tool: run_backtest
  within: 3
rubric: Notices the symbol does not exist, finds a real one, and completes the run.
